<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#174a6e">
<title>Temperaturas</title>
<style>
  :root { color-scheme: light; --blue:#174a6e; --line:#d7e0e7; --yellow:#fff4cc; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: #f3f6f8; color: #17232d;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 620px; margin: 0 auto; }
  header { margin: 4px 0 16px; }
  h1 { margin: 0 0 5px; font-size: 1.55rem; color: var(--blue); }
  .hint { margin: 0; color: #52616b; font-size: .95rem; }
  .row {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(112px, .72fr);
    gap: 10px; align-items: center; padding: 10px; margin: 9px 0;
    background: white; border: 1px solid var(--line); border-radius: 12px;
  }
  label { display:block; font-size: .75rem; font-weight: 700; color:#52616b; margin: 0 0 4px 2px; }
  input {
    width:100%; min-width:0; min-height:52px; border:1px solid #c6d2dc;
    border-radius:9px; padding:10px; font:inherit; font-size:1.05rem;
    background:white; color:#17232d;
  }
  .temp { background:var(--yellow); text-align:center; font-size:1.25rem; font-weight:650; }
  .actions { position: sticky; bottom: 0; padding: 12px 0 4px; background:linear-gradient(transparent, #f3f6f8 18%); }
  button {
    width:100%; min-height:54px; border:0; border-radius:12px; padding:12px 16px;
    font:inherit; font-weight:700; font-size:1rem; color:white; background:#a52a2a;
  }
  button:active { transform:scale(.99); }
  .saved { min-height:22px; margin:7px 2px 0; text-align:center; font-size:.82rem; color:#52616b; }
  @media (min-width:520px) { .row { grid-template-columns: 1fr 180px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Temperaturas</h1>
    <p class="hint">Escribe el nombre de cada zona y su temperatura. Los cambios se guardan automáticamente en este dispositivo.</p>
  </header>
  <section id="list" aria-label="Zonas de medición"></section>
  <div class="actions">
    <button id="clear" type="button">Borrar todas las temperaturas</button>
    <p class="saved" id="status" aria-live="polite">Guardado automático activado</p>
  </div>
</main>
<script>
(() => {
  const KEY = "registro-temperaturas-zonas-v1";
  const defaults = Array.from({length:20}, (_,i) => ({name:`Zona ${i+1}`, temp:""}));
  let data = defaults;
  try {
    const stored = JSON.parse(localStorage.getItem(KEY));
    if (Array.isArray(stored) && stored.length === 20) data = stored;
  } catch (_) {}
  const list = document.getElementById("list");
  const status = document.getElementById("status");

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(data));
      status.textContent = "Guardado automáticamente";
    } catch (_) {
      status.textContent = "No se ha podido guardar. Comprueba el navegador.";
    }
  }

  data.forEach((item, i) => {
    const row = document.createElement("div");
    row.className = "row";

    const nameWrap = document.createElement("div");
    const nameLabel = document.createElement("label");
    nameLabel.htmlFor = `name-${i}`;
    nameLabel.textContent = `ZONA ${i+1}`;
    const name = document.createElement("input");
    name.id = `name-${i}`;
    name.type = "text";
    name.value = item.name || "";
    name.placeholder = `Zona ${i+1}`;
    name.autocomplete = "off";
    name.addEventListener("input", () => { data[i].name = name.value; save(); });
    nameWrap.append(nameLabel, name);

    const tempWrap = document.createElement("div");
    const tempLabel = document.createElement("label");
    tempLabel.htmlFor = `temp-${i}`;
    tempLabel.textContent = "TEMPERATURA (°C)";
    const temp = document.createElement("input");
    temp.id = `temp-${i}`;
    temp.className = "temp";
    temp.type = "text";
    temp.inputMode = "decimal";
    temp.autocomplete = "off";
    temp.placeholder = "—";
    temp.value = item.temp || "";
    temp.setAttribute("aria-label", `Temperatura de ${item.name || `Zona ${i+1}`}`);
    temp.addEventListener("input", () => { data[i].temp = temp.value; save(); });
    tempWrap.append(tempLabel, temp);

    row.append(nameWrap, tempWrap);
    list.append(row);
  });

  document.getElementById("clear").addEventListener("click", () => {
    if (!confirm("¿Borrar las 20 temperaturas? Los nombres de las zonas se conservarán.")) return;
    data.forEach((item, i) => {
      item.temp = "";
      const field = document.getElementById(`temp-${i}`);
      field.value = "";
    });
    save();
    status.textContent = "Temperaturas borradas. Los nombres se han conservado.";
    window.scrollTo({top:0, behavior:"smooth"});
  });
})();
</script>
</body>
</html>
